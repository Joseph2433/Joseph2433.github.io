<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdd9b5"/>
      <stop offset="100%" style="stop-color:#f5c69a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <!-- Body -->
  <ellipse cx="200" cy="380" rx="120" ry="80" fill="#e2e8f0"/>
  <!-- Neck -->
  <rect x="180" y="270" width="40" height="30" rx="8" fill="url(#skin)"/>
  <!-- Head -->
  <ellipse cx="200" cy="200" rx="80" ry="90" fill="url(#skin)"/>
  <!-- Hair -->
  <ellipse cx="200" cy="145" rx="85" ry="55" fill="#1e293b"/>
  <rect x="115" y="140" width="170" height="30" rx="15" fill="#1e293b"/>
  <!-- Eyes -->
  <ellipse cx="170" cy="210" rx="8" ry="9" fill="#1e293b"/>
  <ellipse cx="230" cy="210" rx="8" ry="9" fill="#1e293b"/>
  <circle cx="173" cy="207" r="2.5" fill="#fff"/>
  <circle cx="233" cy="207" r="2.5" fill="#fff"/>
  <!-- Eyebrows -->
  <rect x="155" y="192" width="30" height="4" rx="2" fill="#1e293b"/>
  <rect x="215" y="192" width="30" height="4" rx="2" fill="#1e293b"/>
  <!-- Mouth (smile) -->
  <path d="M 180 240 Q 200 260 220 240" fill="none" stroke="#c0846e" stroke-width="3" stroke-linecap="round"/>
  <!-- Glasses -->
  <circle cx="170" cy="210" r="20" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="230" cy="210" r="20" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="190" y1="210" x2="210" y2="210" stroke="#334155" stroke-width="3"/>
  <!-- Hoodie -->
  <path d="M 120 310 Q 120 280 160 270 L 170 300 L 200 310 L 230 300 L 240 270 Q 280 280 280 310 L 280 400 L 120 400 Z" fill="#667eea"/>
  <path d="M 180 270 L 190 310 L 200 320 L 210 310 L 220 270" fill="none" stroke="#5a6fd6" stroke-width="2"/>
</svg>
